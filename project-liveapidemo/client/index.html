<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>AI Travel Assistant - Live API Demo</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  </head>
  <body>
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="header-logo">
          <span class="material-symbols-outlined">travel_explore</span>
        </div>
        <div>
          <div class="header-title">AI Travel Assistant</div>
          <div class="header-subtitle">Voice &amp; Text Multimodal Chat</div>
        </div>
      </div>
      <div class="header-right">
        <div class="connection-status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Connecting...</span>
        </div>
      </div>
    </header>

    <!-- Side Panel Toggle (mobile) -->
    <button class="side-panel-toggle" id="sidePanelToggle">
      <span class="material-symbols-outlined">dock_to_left</span>
    </button>

    <!-- Main Layout -->
    <div class="app-layout">
      <!-- Chat Panel -->
      <div class="chat-panel">
        <div id="output"></div>
      </div>

      <!-- Side Panel -->
      <aside class="side-panel" id="sidePanel">
        <!-- Map Section -->
        <div class="panel-section collapsed" id="mapSection">
          <div class="panel-section-header" data-toggle="mapSection">
            <span class="material-symbols-outlined">map</span>
            Map
            <span class="material-symbols-outlined expand-arrow">expand_more</span>
          </div>
          <div class="panel-section-content">
            <div id="mapContainer" class="map-wrapper">
              <div id="map" style="width: 100%; height: 100%;"></div>
            </div>
          </div>
        </div>

        <!-- Video Section -->
        <div class="panel-section collapsed" id="videoSection">
          <div class="panel-section-header" data-toggle="videoSection">
            <span class="material-symbols-outlined">videocam</span>
            Video Preview
            <span class="material-symbols-outlined expand-arrow">expand_more</span>
          </div>
          <div class="panel-section-content">
            <div class="video-wrapper" id="videoWrapper">
              <video id="videoPreview" autoplay playsinline></video>
            </div>
          </div>
        </div>

        <!-- Function Info Section -->
        <div class="panel-section collapsed" id="debugSection">
          <div class="panel-section-header" data-toggle="debugSection">
            <span class="material-symbols-outlined">terminal</span>
            Debug Console
            <span class="material-symbols-outlined expand-arrow">expand_more</span>
          </div>
          <div class="panel-section-content">
            <div id="functionInfo"></div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Input Bar -->
    <div class="input-bar">
      <div class="media-buttons">
        <button id="micButton" disabled class="action-button" title="Microphone">
          <span class="material-symbols-outlined">mic</span>
        </button>
        <button id="webcamButton" class="action-button" title="Webcam">
          <span class="material-symbols-outlined">videocam</span>
        </button>
        <button id="screenButton" class="action-button" title="Screen Share">
          <span class="material-symbols-outlined">present_to_all</span>
        </button>
      </div>
      <div class="text-input-wrapper">
        <input
          type="text"
          id="textInput"
          placeholder="Type your message..."
          class="text-input"
        />
        <button id="sendButton" class="send-button" title="Send">
          <span class="material-symbols-outlined">send</span>
        </button>
        <button
          id="interruptButton"
          class="interrupt-button"
          style="display: none"
          title="Interrupt"
        >
          <span class="material-symbols-outlined">stop</span>
        </button>
      </div>
    </div>

    <!-- Load EventEmitter3 first -->
    <script src="https://cdn.jsdelivr.net/npm/eventemitter3@5.0.1/dist/eventemitter3.umd.min.js"></script>

    <script>
      // Google Maps API will be loaded dynamically after receiving the API key from server
      window.mapReady = false;
      window.initMap = function () {
        window.mapReady = true;
        console.log("Google Maps API loaded");
      };
      window.loadGoogleMapsAPI = function (apiKey) {
        if (window.mapReady || document.getElementById("google-maps-script"))
          return;
        const script = document.createElement("script");
        script.id = "google-maps-script";
        script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=geometry,marker&callback=initMap`;
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
      };
    </script>

    <script type="module">
      import { AudioRecorder } from "./src/audio/audio-recorder.js";
      import { AudioStreamer } from "./src/audio/audio-streamer.js";
      import { MediaHandler } from "./src/media/media-handler.js";
      import { GeminiAPI } from "./src/api/gemini-api.js";
      import { base64ToArrayBuffer } from "./src/utils/utils.js";
      import { MapHandler } from "./src/map/map-handler.js";

      // Initialize components
      const output = document.getElementById("output");
      const audioRecorder = new AudioRecorder();
      const audioContext = new (window.AudioContext ||
        window.webkitAudioContext)({ sampleRate: 24000 });
      const audioStreamer = new AudioStreamer(audioContext);
      const mediaHandler = new MediaHandler();
      const wsEndpoint = "ws://localhost:8081";
      const api = new GeminiAPI(wsEndpoint);
      const mapHandler = new MapHandler();

      // --- Side Panel Accordion ---
      document.querySelectorAll(".panel-section-header").forEach((header) => {
        header.addEventListener("click", () => {
          const sectionId = header.getAttribute("data-toggle");
          const section = document.getElementById(sectionId);
          if (section) section.classList.toggle("collapsed");
        });
      });

      // --- Side Panel Toggle (mobile) ---
      document.getElementById("sidePanelToggle").addEventListener("click", () => {
        document.getElementById("sidePanel").classList.toggle("open");
      });

      // --- Map Initialization ---
      // Pass the panel section element so show/hide/toggle controls the accordion
      function tryInitMap() {
        if (window.mapReady) {
          mapHandler.initialize("map", document.getElementById("mapSection"));
        } else {
          setTimeout(tryInitMap, 200);
        }
      }
      tryInitMap();

      // --- State ---
      let isRecording = false;
      let hasShownSpeakingMessage = false;
      let currentTurn = 0;
      let lastAudioTurn = -1;

      // Transcription management
      let inputTranscriptionBuffer = "";
      let outputTranscriptionBuffer = "";
      let currentInputTranscriptionId = null;
      let currentOutputTranscriptionId = null;

      // Initialize media handler
      mediaHandler.initialize(document.getElementById("videoPreview"));

      // --- Connection Status ---
      function setConnectionStatus(connected) {
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");
        if (connected) {
          dot.classList.add("connected");
          text.textContent = "Connected";
        } else {
          dot.classList.remove("connected");
          text.textContent = "Disconnected";
        }
      }

      // --- Helpers ---
      function getTimestamp() {
        const now = new Date();
        return now.toLocaleTimeString("zh-TW", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function createMessageRow(type, content, isInterim) {
        const row = document.createElement("div");
        row.className = `message-row ${type}`;
        if (isInterim) row.classList.add("interim");

        if (type === "user" || type === "gemini") {
          const avatar = document.createElement("div");
          avatar.className = `msg-avatar ${type}-avatar`;
          const avatarIcon = document.createElement("span");
          avatarIcon.className = "material-symbols-outlined";
          avatarIcon.textContent = type === "user" ? "person" : "auto_awesome";
          avatar.appendChild(avatarIcon);

          const body = document.createElement("div");
          body.className = "msg-body";
          const msgContent = document.createElement("div");
          msgContent.className = "msg-content";
          msgContent.textContent = content;
          const time = document.createElement("div");
          time.className = "msg-time";
          time.textContent = getTimestamp();
          body.appendChild(msgContent);
          body.appendChild(time);

          row.appendChild(avatar);
          row.appendChild(body);
        } else {
          const msgContent = document.createElement("div");
          msgContent.className = "msg-content";
          msgContent.textContent = content;
          row.appendChild(msgContent);
        }

        return row;
      }

      function createFunctionCard(name, params) {
        const card = document.createElement("div");
        card.className = "function-card";

        const header = document.createElement("div");
        header.className = "function-card-header";
        header.innerHTML = `
          <span class="material-symbols-outlined">function</span>
          <span class="function-card-title">${name}</span>
          <span class="material-symbols-outlined expand-icon">expand_more</span>
        `;
        header.addEventListener("click", () => {
          card.classList.toggle("expanded");
        });

        const body = document.createElement("div");
        body.className = "function-card-body";
        const pre = document.createElement("pre");
        pre.textContent = params;
        body.appendChild(pre);

        card.appendChild(header);
        card.appendChild(body);
        return card;
      }

      function createToolIndicator(text, done) {
        const el = document.createElement("div");
        el.className = "tool-indicator" + (done ? " done" : "");
        const icon = document.createElement("span");
        icon.className = "material-symbols-outlined";
        icon.textContent = done ? "check_circle" : "sync";
        el.appendChild(icon);
        const span = document.createElement("span");
        span.textContent = text;
        el.appendChild(span);
        return el;
      }

      function createRouteInfo(text) {
        const el = document.createElement("div");
        el.className = "route-info";
        const icon = document.createElement("span");
        icon.className = "material-symbols-outlined";
        icon.textContent = "route";
        el.appendChild(icon);
        const span = document.createElement("span");
        span.textContent = text;
        el.appendChild(span);
        return el;
      }

      // --- API Handlers ---
      api.onReady = (readyMsg) => {
        document.getElementById("micButton").disabled = false;
        setConnectionStatus(true);
        if (readyMsg && readyMsg.maps_js_api_key) {
          window.loadGoogleMapsAPI(readyMsg.maps_js_api_key);
        }
      };

      api.onAudioData = async (audioData) => {
        try {
          if (!api.isSpeaking || lastAudioTurn !== currentTurn) {
            logMessage("gemini-speaking", "Speaking...");
            api.isSpeaking = true;
            lastAudioTurn = currentTurn;
            document.getElementById("interruptButton").style.display = "flex";
            document.getElementById("sendButton").style.display = "none";
          }
          const arrayBuffer = base64ToArrayBuffer(audioData);
          audioStreamer.addPCM16(new Uint8Array(arrayBuffer));
          audioStreamer.resume();
        } catch (error) {
          console.error("Error playing audio:", error);
        }
      };

      api.onTextContent = (text) => {
        if (text.trim()) {
          logMessage("gemini", text);
        }
      };

      api.onTurnComplete = () => {
        logMessage("system", "Finished speaking");
        api.isSpeaking = false;
        audioStreamer.complete();
        document.getElementById("interruptButton").style.display = "none";
        document.getElementById("sendButton").style.display = "flex";

        // Finalize any remaining transcriptions
        if (currentOutputTranscriptionId && outputTranscriptionBuffer) {
          logAccumulatedTranscription(
            outputTranscriptionBuffer,
            "gemini",
            false,
            "output"
          );
          outputTranscriptionBuffer = "";
        }

        if (currentInputTranscriptionId && inputTranscriptionBuffer) {
          logAccumulatedTranscription(
            inputTranscriptionBuffer,
            "user",
            false,
            "input"
          );
          inputTranscriptionBuffer = "";
        }
      };

      api.onInterrupted = () => {
        api.isSpeaking = false;
        audioStreamer.stop();
        document.getElementById("interruptButton").style.display = "none";
        document.getElementById("sendButton").style.display = "flex";

        const el = document.createElement("div");
        el.className = "interrupted-message";
        el.textContent = "Response interrupted";
        output.appendChild(el);
        output.scrollTop = output.scrollHeight;
      };

      api.onFunctionCall = (data) => {
        const card = createFunctionCard(
          data.name,
          JSON.stringify(data.args, null, 2)
        );
        output.appendChild(card);
        output.scrollTop = output.scrollHeight;

        // Also update side panel debug
        const info = document.getElementById("functionInfo");
        info.innerHTML = `<pre><span class="function-name-display">Function: ${data.name}</span>\n<span class="function-params-display">Parameters: ${JSON.stringify(data.args, null, 2)}</span></pre>`;
      };

      api.onFunctionResponse = (data) => {
        const result = data.result || {};
        const info = document.getElementById("functionInfo");

        if (data.name === "compute_route" && result.encoded_polyline) {
          mapHandler.drawRoute(
            result.encoded_polyline,
            result.origin_latlng,
            result.destination_latlng
          );

          const routeText = `${result.origin} → ${result.destination} | ${result.distance_km} km | ${result.duration_minutes} min`;
          output.appendChild(createRouteInfo(routeText));
          output.scrollTop = output.scrollHeight;

          const summaryEl = document.createElement("pre");
          summaryEl.innerHTML = `<span class="function-response-display">Route: ${routeText}</span>`;
          info.appendChild(summaryEl);
        } else if (data.name === "compute_route" && result.error) {
          // Route computation failed — show error in chat
          const errRow = createMessageRow("system", `Route error: ${result.error}`);
          output.appendChild(errRow);
          output.scrollTop = output.scrollHeight;
        } else if (
          (data.name === "search_places_along_route" ||
            data.name === "search_nearby_places") &&
          result.places &&
          result.places.length > 0
        ) {
          mapHandler.addPlaceMarkers(result.places);
          mapHandler.show();

          const placeNames = result.places.map((p) => p.name).join(", ");
          const text = `Found ${result.count} places: ${placeNames}`;
          output.appendChild(createRouteInfo(text));
          output.scrollTop = output.scrollHeight;

          const placesEl = document.createElement("pre");
          placesEl.innerHTML = `<span class="function-response-display">${text}</span>`;
          info.appendChild(placesEl);
        } else {
          const responseEl = document.createElement("pre");
          responseEl.innerHTML = `<span class="function-response-display">Response:\n${JSON.stringify(data, null, 2)}</span>`;
          info.appendChild(responseEl);
        }
      };

      api.onToolUse = (data) => {
        const toolName =
          data.tool === "google_search" ? "Google Search" : data.tool;
        output.appendChild(
          createToolIndicator(`Executing ${toolName}...`, false)
        );
        output.scrollTop = output.scrollHeight;

        const info = document.getElementById("functionInfo");
        const toolEl = document.createElement("pre");
        toolEl.innerHTML = `<span class="tool-execution-display">Executing ${toolName}...\nCode: ${data.code}</span>`;
        info.appendChild(toolEl);
      };

      api.onToolResult = (data) => {
        const toolName =
          data.tool === "google_search" ? "Google Search" : data.tool;
        output.appendChild(createToolIndicator(`${toolName} complete`, true));
        output.scrollTop = output.scrollHeight;

        const info = document.getElementById("functionInfo");
        const resultEl = document.createElement("pre");
        resultEl.innerHTML = `<span class="tool-result-display">${toolName} complete</span>`;
        info.appendChild(resultEl);
      };

      api.onInputTranscription = (data) => {
        const isInterim = data.is_final === null || data.is_final === false;
        if (isInterim) {
          inputTranscriptionBuffer += data.text;
          logAccumulatedTranscription(
            inputTranscriptionBuffer,
            "user",
            true,
            "input"
          );
        } else {
          inputTranscriptionBuffer += data.text;
          logAccumulatedTranscription(
            inputTranscriptionBuffer,
            "user",
            false,
            "input"
          );
          inputTranscriptionBuffer = "";
        }
      };

      api.onOutputTranscription = (data) => {
        const isInterim = data.is_final === null || data.is_final === false;
        if (isInterim) {
          outputTranscriptionBuffer += data.text;
          logAccumulatedTranscription(
            outputTranscriptionBuffer,
            "gemini",
            true,
            "output"
          );
        } else {
          outputTranscriptionBuffer += data.text;
          logAccumulatedTranscription(
            outputTranscriptionBuffer,
            "gemini",
            false,
            "output"
          );
          outputTranscriptionBuffer = "";
        }
      };

      // --- Message Logging ---
      function logMessage(type, content) {
        if (type === "gemini-speaking") {
          const row = createMessageRow("gemini", content, false);
          row.querySelector(".msg-content").style.fontStyle = "italic";
          row.querySelector(".msg-content").style.opacity = "0.6";
          output.appendChild(row);
        } else if (type === "system") {
          const row = createMessageRow("system", content, false);
          output.appendChild(row);
        } else if (type === "gemini") {
          output.appendChild(createMessageRow("gemini", content, false));
        } else if (type === "user") {
          output.appendChild(createMessageRow("user", content, false));
        }
        output.scrollTop = output.scrollHeight;
      }

      function logAccumulatedTranscription(content, type, isInterim, transcriptionType) {
        const transcriptionId =
          transcriptionType === "input"
            ? currentInputTranscriptionId
            : currentOutputTranscriptionId;

        let row = transcriptionId
          ? document.getElementById(transcriptionId)
          : null;

        if (isInterim) {
          if (!row) {
            row = createMessageRow(type, content, true);
            const newId = `transcription-${transcriptionType}-${Date.now()}-${Math.random()
              .toString(36)
              .substr(2, 9)}`;
            row.id = newId;

            if (transcriptionType === "input") {
              currentInputTranscriptionId = newId;
            } else {
              currentOutputTranscriptionId = newId;
            }
            output.appendChild(row);
          } else {
            const msgContent = row.querySelector(".msg-content");
            if (msgContent) msgContent.textContent = content;
          }
        } else {
          if (row) {
            const msgContent = row.querySelector(".msg-content");
            if (msgContent) msgContent.textContent = content;
            row.classList.remove("interim");
            row.classList.add("final");
          } else {
            const finalRow = createMessageRow(type, content, false);
            finalRow.classList.add("final");
            output.appendChild(finalRow);
          }

          if (transcriptionType === "input") {
            currentInputTranscriptionId = null;
          } else {
            currentOutputTranscriptionId = null;
          }
        }

        output.scrollTop = output.scrollHeight;
      }

      // --- UI Event Handlers ---
      async function startRecording() {
        try {
          if (api.isSpeaking) {
            audioStreamer.stop();
            api.isSpeaking = false;
          }

          inputTranscriptionBuffer = "";
          currentInputTranscriptionId = null;

          await audioContext.resume();
          await audioRecorder.start();
          hasShownSpeakingMessage = false;
          currentTurn++;

          audioRecorder.on("data", (base64Data) => {
            if (!hasShownSpeakingMessage) {
              logMessage("system", "Listening...");
              hasShownSpeakingMessage = true;
            }
            api.sendAudioChunk(base64Data);
          });

          isRecording = true;
          const micBtn = document.getElementById("micButton");
          micBtn.classList.add("recording");
          micBtn.innerHTML =
            '<span class="material-symbols-outlined">stop</span>';
        } catch (error) {
          console.error("Error starting recording:", error);
        }
      }

      function stopRecording() {
        audioRecorder.stop();
        isRecording = false;
        hasShownSpeakingMessage = false;
        const micBtn = document.getElementById("micButton");
        micBtn.classList.remove("recording");
        micBtn.innerHTML =
          '<span class="material-symbols-outlined">mic</span>';
        logMessage("system", "Recording stopped");

        mediaHandler.stopAll();
        document.getElementById("webcamButton").classList.remove("active");
        document.getElementById("webcamButton").innerHTML =
          '<span class="material-symbols-outlined">videocam</span>';
        document.getElementById("screenButton").classList.remove("active");
        document.getElementById("screenButton").innerHTML =
          '<span class="material-symbols-outlined">present_to_all</span>';

        // Collapse video section if no video active
        document.getElementById("videoSection").classList.add("collapsed");

        api.sendEndMessage();
        api.isSpeaking = false;
      }

      function sendTextMessage() {
        const textInput = document.getElementById("textInput");
        const text = textInput.value.trim();
        if (!text) return;

        textInput.value = "";
        outputTranscriptionBuffer = "";
        currentOutputTranscriptionId = null;

        logMessage("user", text);
        api.sendTextMessage(text);
      }

      // Button click handlers
      document.getElementById("micButton").onclick = () => {
        if (isRecording) {
          stopRecording();
        } else {
          startRecording();
        }
      };

      document.getElementById("sendButton").onclick = sendTextMessage;

      document
        .getElementById("textInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") sendTextMessage();
        });

      document.getElementById("interruptButton").onclick = () => {
        if (api.isSpeaking) {
          audioStreamer.stop();
          api.isSpeaking = false;
          document.getElementById("interruptButton").style.display = "none";
          document.getElementById("sendButton").style.display = "flex";
        }
      };

      document.getElementById("webcamButton").onclick = async () => {
        if (mediaHandler.isWebcamActive) {
          mediaHandler.stopAll();
          document.getElementById("webcamButton").classList.remove("active");
          document.getElementById("webcamButton").innerHTML =
            '<span class="material-symbols-outlined">videocam</span>';
          document.getElementById("videoSection").classList.add("collapsed");
        } else {
          const success = await mediaHandler.startWebcam();
          if (success) {
            document.getElementById("webcamButton").classList.add("active");
            document.getElementById("webcamButton").innerHTML =
              '<span class="material-symbols-outlined">videocam_off</span>';
            // Expand video section
            document
              .getElementById("videoSection")
              .classList.remove("collapsed");
            mediaHandler.startFrameCapture((base64Image) => {
              api.sendImage(base64Image);
            });
          }
        }
      };

      document.getElementById("screenButton").onclick = async () => {
        if (mediaHandler.isScreenActive) {
          mediaHandler.stopAll();
          document.getElementById("screenButton").classList.remove("active");
          document.getElementById("screenButton").innerHTML =
            '<span class="material-symbols-outlined">present_to_all</span>';
          document.getElementById("videoSection").classList.add("collapsed");
        } else {
          const success = await mediaHandler.startScreenShare();
          if (success) {
            document.getElementById("screenButton").classList.add("active");
            document.getElementById("screenButton").innerHTML =
              '<span class="material-symbols-outlined">cancel_presentation</span>';
            document
              .getElementById("videoSection")
              .classList.remove("collapsed");
            mediaHandler.startFrameCapture((base64Image) => {
              api.sendImage(base64Image);
            });
          }
        }
      };
    </script>
  </body>
</html>
